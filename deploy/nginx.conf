# Example standalone deployment. Adjust root and upstream addresses to the host.
server {
    listen 8088;
    server_name localhost;
    root /srv/opc-console-ui/dist;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location /api/server/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 45s;
        proxy_next_upstream off;
    }
    location /api/gateway/ {
        proxy_pass http://127.0.0.1:1234/api/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 45s;
        proxy_next_upstream off;
    }
    location /api/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    }
}
