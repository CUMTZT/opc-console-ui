# 独立生产部署示例：root 指向构建后的 dist，两个上游地址按部署环境修改。
# Nginx 提供静态文件和同源 API 代理，React 浏览器代码不需要知道 Go 服务真实地址。
server {
    listen 8088;
    server_name localhost;
    root /srv/opc-console-ui/dist;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location /api/server/ {
        # 尾部 /api/ 会替换匹配到的 /api/server/；保留原始 Host 供后端检查请求来源。
        # Origin 与 Sec-Fetch-Site 默认透传，不在此伪造或覆盖。
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 45s;
        # 写入结果未知时不能由代理自动换上游重发。
        proxy_next_upstream off;
    }
    location /api/gateway/ {
        proxy_pass http://127.0.0.1:1234/api/;
        proxy_set_header Host $http_host;
        proxy_read_timeout 45s;
        proxy_next_upstream off;
    }
    location /api/ { return 404; }
    location /assets/ {
        # Vite 构建资源含内容散列，内容变化会换文件名，因此可以长期缓存。
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        # 页面入口不长期缓存，便于加载新版本；Hash 路由的 # 后内容不会发给 Nginx。
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
    }
}
